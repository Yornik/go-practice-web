{{define "content"}}
<div class="wrap page error-page">
  <section aria-labelledby="error-title">
    <header class="page-head">
      <h1 id="error-title">{{.Data.Message}}</h1>
      {{- with .Data.Detail}}
      <p class="lede">{{.}}</p>
      {{- end}}
    </header>
    <p>{{if eq .Data.Status 404}}Check the address, or go to:{{else}}Go to:{{end}}</p>
    <p class="error-links mt-3">
      {{- if .User}}<a href="/learn">Your course</a>{{else}}<a href="/">The start page</a>{{end}}
      <a href="/guide">The guide</a>
      <a href="/verify">Verify a certificate</a>
    </p>
  </section>
</div>
{{end}}
