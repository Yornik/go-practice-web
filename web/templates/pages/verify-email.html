{{define "content"}}
<div class="wrap page">
  <section class="auth narrow" aria-labelledby="verify-title">
    <header class="page-head">
      <h1 id="verify-title">Verify your email address</h1>
      <p class="lede">Confirm that this address is yours. Recovery links can then go to it.</p>
    </header>
    <form id="verify-email-form" class="auth-form" data-token="{{.Data.Token}}">
      <button type="submit" class="btn btn-primary btn-lg">Confirm my address</button>
      <p class="form-status mt-4" role="status" aria-live="polite"></p>
    </form>
    <p class="mt-4" hidden data-verified-next><a class="btn" href="/learn">Open your course</a></p>
  </section>
</div>
{{end}}
