# CI on every pull request and push to main. release.yml calls it too, so
# the images of a release come only from a commit that passes it
# (docs/DESIGN.md, "Build and release").
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: The commit to test. Empty means the commit of the event.
        type: string
        default: ""

permissions:
  contents: read

# The workflow name is the caller's when release.yml calls this file, so a
# release's checks never queue behind the CI run of the same push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The images build with this release (Dockerfile.web, Dockerfile.runner),
  # and the explain fixtures pin it: the compiler's messages are part of what
  # they check. Renovate moves all of them in 1 pull request, and the "Go
  # release" step below fails while they differ.
  # renovate: datasource=golang-version depName=go
  GO_VERSION: "1.27.2"
  GOTOOLCHAIN: local

jobs:
  check:
    name: gofmt, vet, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # release.yml passes the release commit; other events leave it empty.
          ref: ${{ inputs.ref }}
          submodules: true
      # go.dev and Docker Hub publish a Go release at different times, so a
      # Renovate pull request can move GO_VERSION before the images. A release
      # must build with the Go release that this job tests.
      - name: Go release
        run: |
          fail=0
          want() {
            if ! grep -qF -- "$2" "$1"; then
              echo "::error file=$1::$1 does not name Go $GO_VERSION: want $2"
              fail=1
            fi
          }
          want Dockerfile.web "ARG GO_IMAGE=golang:${GO_VERSION}-bookworm"
          want Dockerfile.runner "ARG GO_IMAGE=golang:${GO_VERSION}-bookworm"
          want internal/explain/fixtures_test.go "const fixtureToolchain = \"go${GO_VERSION}\""
          want internal/godoc/godoc.go "cmd/gendocs -go go${GO_VERSION%.*} "
          exit "$fail"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          # The explain fixtures are broken on purpose.
          out="$(git ls-files '*.go' | grep -v '/testdata/' | xargs gofmt -l)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      # Both tools load the standard library's export data, so they are
      # built by the Go release that CI runs.
      - name: Install golangci-lint and staticcheck
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: golangci-lint run ./...
      - name: go test -race
        env:
          # The staticcheck fixtures fail instead of skipping without it.
          EXPLAIN_REQUIRE_STATICCHECK: "1"
        run: go test -race ./...

  # Renovate moves the font versions and their sha512 in
  # scripts/fetch-fonts.sh, but it cannot copy the font files. The script
  # checks each tarball against its hash, and the diff catches committed
  # fonts of another version. A font bump stays red until a person commits
  # the files, and release.yml builds no image from a red commit.
  fonts:
    name: fonts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # release.yml passes the release commit; other events leave it empty.
          ref: ${{ inputs.ref }}
      - run: scripts/fetch-fonts.sh
      - name: web/static/fonts is what the script fetches
        run: |
          out="$(git status --porcelain -- web/static/fonts)"
          if [ -n "$out" ]; then
            echo "::error::web/static/fonts differs from scripts/fetch-fonts.sh: run it and commit the files"
            echo "$out"
            exit 1
          fi

  e2e:
    name: end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # release.yml passes the release commit; other events leave it empty.
          ref: ${{ inputs.ref }}
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: scripts/fetch-monaco.sh
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: e2e
        env:
          # A known place for the logs of scripts/dev.sh.
          GO_PRACTICE_DEV_STATE: ${{ runner.temp }}/gpw-state
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            e2e/test-results/
            ${{ runner.temp }}/gpw-state/*.log
          retention-days: 7
