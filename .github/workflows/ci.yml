# CI on every pull request and push to main. A tag vX.Y.Z also builds and
# pushes the 2 images that the gitops repository pins (docs/DESIGN.md,
# "Build and release").
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The images build on golang:1.27-bookworm, and the explain fixtures pin
  # this release: the compiler's messages are part of what they check.
  GO_VERSION: "1.27.2"
  GOTOOLCHAIN: local

jobs:
  check:
    name: gofmt, vet, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          # The explain fixtures are broken on purpose.
          out="$(git ls-files '*.go' | grep -v '/testdata/' | xargs gofmt -l)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      # Both tools load the standard library's export data, so they are
      # built by the Go release that CI runs.
      - name: Install golangci-lint and staticcheck
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: golangci-lint run ./...
      - name: go test -race
        env:
          # The staticcheck fixtures fail instead of skipping without it.
          EXPLAIN_REQUIRE_STATICCHECK: "1"
        run: go test -race ./...

  e2e:
    name: end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: scripts/fetch-monaco.sh
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: e2e
        env:
          # A known place for the logs of scripts/dev.sh.
          GO_PRACTICE_DEV_STATE: ${{ runner.temp }}/gpw-state
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            e2e/test-results/
            ${{ runner.temp }}/gpw-state/*.log
          retention-days: 7

  release:
    name: images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [web, runner]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yornik/go-practice-${{ matrix.image }}
          # Only the exact tag: the gitops repository pins it, and Renovate
          # bumps it there. Without latest=false, every tag (an RC, or a
          # backport after a newer release) also moves :latest.
          flavor: latest=false
          tags: type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
